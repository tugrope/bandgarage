<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- チェリーサンバースト グラデーション -->
    <radialGradient id="cherrySunburst" cx="42%" cy="54%" r="55%" fx="40%" fy="48%">
      <stop offset="0%" stop-color="#fff885"/>
      <stop offset="28%" stop-color="#ffb81c"/>
      <stop offset="55%" stop-color="#e84118"/>
      <stop offset="82%" stop-color="#b81424"/>
      <stop offset="100%" stop-color="#6a0a14"/>
    </radialGradient>

    <!-- コントロールプレート / 金属パーツ用グラデーション -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#dcdde1"/>
      <stop offset="65%" stop-color="#718093"/>
      <stop offset="100%" stop-color="#2f3640"/>
    </linearGradient>

    <!-- 立体感シャドウ -->
    <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="pgShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ギターボディ全体 -->
  <g filter="url(#bodyShadow)">
    <!-- テレキャスター ボディ輪郭 -->
    <path d="
      M 25 3
      L 39 3
      C 40.5 3, 41 8, 41.5 14
      C 42 19, 44 21.5, 47.5 20
      C 51 18.5, 56 16.5, 58.5 19
      C 60.5 21, 60 24, 58 27
      C 55 31.5, 53.5 35, 55 40
      C 57.5 46.5, 61 49.5, 59.5 55
      C 58 60.5, 47 62.5, 32 62.5
      C 17 62.5, 6 60.5, 4.5 55
      C 3 49.5, 6.5 46.5, 9 40
      C 10.5 35, 9 31.5, 6 27
      C 3 22.5, 3 15, 9 8
      C 14 2.5, 20.5 3, 25 3
      Z
    " fill="url(#cherrySunburst)" stroke="#4a050c" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- 白のテレキャスター・ピックガード -->
    <path d="
      M 25 3.5
      L 38 3.5
      C 38.5 8.5, 39 13.5, 40 17.5
      C 41.5 20.5, 44.5 20, 48 19
      C 51.5 18, 55 17, 57 19
      C 58 20.2, 57.5 22, 56 24
      C 53.5 27.5, 52 30.5, 51.5 33.5
      C 50.5 38.5, 47.5 40.5, 44 41
      C 38 41.5, 36 37, 34.5 31
      C 33 24, 30.5 21.5, 23.5 21.5
      C 19 21.5, 15.5 17, 13 12.5
      C 11 9, 16.5 4, 25 3.5
      Z
    " fill="#fcfcfc" stroke="#d5d8dc" stroke-width="0.7" filter="url(#pgShadow)"/>

    <!-- フロント・ピックアップ（メタルカバード） -->
    <rect x="28" y="12" width="8" height="3.2" rx="1.6" fill="url(#chrome)" stroke="#4b5563" stroke-width="0.4"/>

    <!-- ブリッジプレート（金属アッシュトレイプレート） -->
    <rect x="26" y="24" width="12" height="14" rx="1.2" fill="url(#chrome)" stroke="#4b5563" stroke-width="0.5"/>
    
    <!-- 3連ブラスサドル -->
    <rect x="27.5" y="31.5" width="2.5" height="4.5" rx="0.6" fill="#f6cf67" stroke="#946d12" stroke-width="0.3"/>
    <rect x="30.7" y="31.5" width="2.5" height="4.5" rx="0.6" fill="#f6cf67" stroke="#946d12" stroke-width="0.3"/>
    <rect x="34" y="31.5" width="2.5" height="4.5" rx="0.6" fill="#f6cf67" stroke="#946d12" stroke-width="0.3"/>

    <!-- 斜めリア・ピックアップ（ブラックボビン＋ポールピース） -->
    <g transform="rotate(13 32 27)">
      <rect x="28" y="25.5" width="8" height="2.8" rx="1" fill="#181a1f" stroke="#111" stroke-width="0.3"/>
      <!-- ポールピース6個 -->
      <circle cx="29" cy="26.9" r="0.45" fill="#e2e8f0"/>
      <circle cx="30.2" cy="26.9" r="0.45" fill="#e2e8f0"/>
      <circle cx="31.4" cy="26.9" r="0.45" fill="#e2e8f0"/>
      <circle cx="32.6" cy="26.9" r="0.45" fill="#e2e8f0"/>
      <circle cx="33.8" cy="26.9" r="0.45" fill="#e2e8f0"/>
      <circle cx="35" cy="26.9" r="0.45" fill="#e2e8f0"/>
    </g>

    <!-- コントロールプレート（右下クロームプレート） -->
    <rect x="42.5" y="34" width="4.5" height="19" rx="2.2" fill="url(#chrome)" stroke="#4b5563" stroke-width="0.4"/>
    <!-- ボリュームノブ＆トーンノブ（ローレットクロームノブ） -->
    <circle cx="44.7" cy="39" r="1.6" fill="url(#chrome)" stroke="#1f2937" stroke-width="0.3"/>
    <circle cx="44.7" cy="46" r="1.6" fill="url(#chrome)" stroke="#1f2937" stroke-width="0.3"/>
    <!-- ピックアップセレクタースイッチ -->
    <rect x="44" y="35" width="1.4" height="2" rx="0.3" fill="#111827"/>
  </g>
</svg>
