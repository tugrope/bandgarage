<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FRET14</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <!-- PWA & フルスクリーン対応 metaタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FRET14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121316">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=20261020_3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
</head>

<body class="theme-maple">

  <div class="app-container" id="appContainer">
    <!-- 指板メインコンテナ（1弦側の上部には何も置かず広々と配置） -->
    <main class="app-main">
      <div class="guitar-neck-wrapper" id="neckWrapper">
        <!-- ギター指板本体 -->
        <div class="fretboard" id="fretboard">
          <!-- JSでフレット(0〜14)と各交点セルを動的生成 -->
        </div>
      </div>
    </main>

    <!-- 6弦側コントロールバー（表示・操作をすべてここに集約） -->
    <footer class="app-footer">
      <!-- 押弦音名表示エリア（「演奏中の音:」ラベル削除、緑文字で発音音を表示） -->
      <div class="played-note-box">
        <span id="currentNoteText" class="current-note">-</span>
      </div>

      <!-- コントロール群（指板材・ネック向き・音名・音量・全画面） -->
      <div class="footer-controls">
        <!-- 指板材セレクト（Maple / Rose） -->
        <select id="fretboardTheme" class="select-ui" title="指板材">
          <option value="theme-maple" selected>Maple</option>
          <option value="theme-rosewood">Rose</option>
        </select>

        <!-- ネック向きセレクト（横左 / 横右） -->
        <select id="neckDirection" class="select-ui" title="ネック向き">
          <option value="left" selected>横左</option>
          <option value="right">横右</option>
        </select>

        <!-- 音名表示セレクト（なし / 全音名 / 白音名 / 全音階 / 白音階） -->
        <select id="noteDisplay" class="select-ui" title="音名表示">
          <option value="none">なし</option>
          <option value="all-english" selected>全音名</option>
          <option value="natural-english">白音名</option>
          <option value="all-solfege">全音階</option>
          <option value="natural-solfege">白音階</option>
        </select>

        <!-- ボリュームスライダー（最大400%ブースト対応） -->
        <div class="volume-group" title="音量設定 (最大4倍)">
          <span class="vol-icon" id="volIcon">🔊</span>
          <input type="range" id="masterVolume" min="0" max="4" step="0.05" value="1.4" class="vol-slider" title="音量">
        </div>

        <!-- フル画面切り替えボタン -->
        <button id="fullscreenBtn" class="btn-icon" title="全画面表示 / 画面向き固定">⛶</button>
      </div>
    </footer>
  </div>

  <!-- iOS向けフルスクリーン案内トースト（初回クリック時などにさりげなく表示） -->
  <div class="ios-fullscreen-hint" id="iosFullscreenHint">
    Safariの共有アイコン <span class="share-icon">⎋</span> から「ホーム画面に追加」するとアドレスバーのない完全フル画面でお使いいただけます
  </div>

  <script src="app.js?v=20261020_3"></script>
</body>

</html>
